<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="styles/style.css" media="all">
    <!-- media = "all" são configurações para todos os dispositivos(tela e impressora) -->
    <link rel="stylesheet" href="styles/retrato.css" media="screen and (orientation: portrait)">
    <!-- css para configurações de dispositivos em modo retrato(vertical) 
    conforme media feature: and (orientation: portrait)
    media type: screen
    media feature: and (orientation: portrait) -->
    <link rel="stylesheet" href="styles/paisagem.css" media="screen and (orientation: landscape)">
    <!-- css para configurações de dispositivos em modo paisagem(horizontal) 
    conforme media feature: and (orientation: landscape)
    media type: screen
    media feature: and (orientation: landscape) -->
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
    <p class="orientation">Sua orientação atual é de: <span id="landscape-orientation">Paisagem (Horizontal)</span> <span id="portrait-orientation">Retrato (Vertical)</span></p>
</body>
</html>
