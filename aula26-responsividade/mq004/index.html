<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="styles/style.css" media="all"> <!-- css para versão para celular fica aqui -->
    <link rel="stylesheet" href="styles/media-query.css"> <!-- demais midias-->
</head>
<body>
    <main>
        <h1>Testando Media Queries</h1>
        <!-- icones que representam cada dispositivo. Eles serão manipulados através do seu id no css-->
        <img id="phone" src="imagens/icon-phone.png" alt="Acesso com Smartphone"> 
        <img id="tablet" src="imagens/icon-tablet.png" alt="Acesso com Tablet">
        <img id="print" src="imagens/icon-print.png" alt="Versão para impressão">
        <img id="pc" src="imagens/icon-pc.png" alt="Versão para pc">
        <img id="tv" src="imagens/icon-tv.png" alt="Versão para TV">
    </main>
</body>
</html>
