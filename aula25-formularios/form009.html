<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="inum">Número: </label><br>
            <input type="range" name="num" id="inum" min="0" max="50" value="0" oninput="ires.innerHTML = Number(inum.value)">
        </p>

        <p>
            <label for="ires">Valor selecionado: </label>
            <output name="res" id="ires">0</output> 
            <!-- exibirá o número selecionado no range do input, conforme atributo oninput colocado e referenciado este output-->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
