<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Testes com mais formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <!-- input do tipo cor para que o usuário possa selecionar uma cor e enviar -->
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" value="#00ff00">
        </p>

        <!-- input do tipo range para medir nível de algo -->
        <p>
            <label for="inivel">Nível de satisfação com o produto: </label>
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="5">
        </p>

        <!-- input do tipo file que permite anexar arquivos no form-->
        <p>
            <label for="iarquivo">Anexar documentos: </label>
            <input type="file" name="arquivo" id="iarquivo">
        </p>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
