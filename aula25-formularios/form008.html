<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário com Output</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="in1">Número 1: </label>
            <input type="number" name="n1" id="in1" required min="0" placeholder="Número de 0 a 50" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            <!-- oninput: quando tiver entrada de dados nesse campo, fará o script js = isoma.innerHTML = Number(in1.value) + Number(in2.value)
            pegando as informações com o id do elemento(Exemplo: output soma tem id isoma, então o utilizamos para apresentar a informação com .innerHTML - substitua todo o HTML pelo valor do input in1 e in2 com .value)-->
        </p>

        <p>
            <label for="in2">Número 2: </label>
            <input type="number" name="n2" id="in2" required min="0" placeholder="Número de 0 a 50" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            <!-- oninput: quando tiver entrada de dados nesse campo, fará o script js = isoma.innerHTML = Number(in1.value) + Number(in2.value)
            pegando as informações com o id do elemento(Exemplo: output soma tem id isoma, então o utilizamos para apresentar a informação com .innerHTML - substitua todo o HTML pelo valor do input in1 e in2 com .value)-->
        </p>

        <p>
            <label for="isoma">Soma: </label>
            <output id="isoma" name="soma">0</output>
            <!-- tag output para exibir uma saída de dados ao usuário-->
            
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
