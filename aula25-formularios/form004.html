<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário com telefone e e-mail</h1>
    <form action="cadastro.php" method="get">
        <!-- tag fieldset para agrupar vários campos entre o inicio e fim dessa tag-->
        <fieldset>
            <!-- tag legend é para explicar os dados agrupados entre o inicio e fim de fieldset-->
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" autocomplete="name" required minlength="4" maxlength="100">
            </p>
            <p>
                <label for="iemail">Email: </label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itelefone">Telefone: </label>
                <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\ d{4,5}-d{4}$" required placeholder="xxxxx-xxxx">
            </p>
        </fieldset>
        <!-- Estudar mais sobre RegEx (uso de pattern no exemplo do telefone)-->
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
