<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário aprimorado</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <!-- utilizando form post já temos informação sensível-->
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="15" placeholder="Informe o usuário" autocomplete="username"><!-- parametro required deixa obrigatório preencher essa campo. Se não for preenchido, exibe uma mensagem
            minlength e maxlength obriga o usuário a digitar valores no intervalo colocado entre min e max length-->           
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="10" placeholder="Informe a senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar"> <!-- botão que limpa o que foi digitado nos campos de input -->
        </p>
    </form>
</body>
</html>
